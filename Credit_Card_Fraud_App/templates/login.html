<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FraudGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="login-card shadow-lg">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-dark"><i class="fa-solid fa-shield-cat text-primary me-2"></i>FraudGuard</h4>
            <p class="text-muted small">Sign in to your dashboard</p>
        </div>
        <form action="/dashboard">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email address</label>
                <input type="email" class="form-control" placeholder="name@company.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Don't have an account? <a href="/register">Register</a></small>
        </div>
    </div>
</body>
</html>
