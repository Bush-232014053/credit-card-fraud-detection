<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FraudGuard AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* WCAG Accessible Highlight */
        ::-selection {
            background-color: #fde047 !important;
            color: #0f172a !important;
        }

        .auth-card {
            background: #ffffff;
            color: #0f172a;
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-3">
            <h4 class="fw-bold text-primary"><i class="fa-solid fa-shield-halved"></i> FraudGuard</h4>
            <p class="text-muted small">Sign in to your risk engine dashboard</p>
        </div>

        <!-- Flash Alert Message Box (Renders validation errors or success messages from Flask) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show small py-2 px-3 mb-3" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ message }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Form submitting via POST to /login -->
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Work Email / Username</label>
                <input type="text" name="email" class="form-control" placeholder="abc@company.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="toggleLoginPassword()">
                        <i class="fa-solid fa-eye" id="loginEyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Sign In</button>
        </form>

        <div class="text-center mt-3">
            <span class="small text-muted">Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-bold">Register</a></span>
        </div>
    </div>

    <!-- Bootstrap JS (Required for closing the alert popup box) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Password visibility toggle script -->
    <script>
        function toggleLoginPassword() {
            const pwd = document.getElementById('loginPassword');
            const icon = document.getElementById('loginEyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }
    </script>
</body>
</html>
