<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Fraud Detection Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f4f7fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }
        .btn-predict {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.4);
            color: #fff;
        }
        .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.25);
        }
        #result-box {
            display: none;
            border-radius: 10px;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <!-- Header Card -->
            <div class="card card-custom p-4 mb-4 text-center">
                <h2 class="fw-bold text-primary mb-2">
                    <i class="fa-solid fa-shield-halved me-2"></i>Fraud Detection Dashboard
                </h2>
                <p class="text-muted mb-0">Enter transaction details below to evaluate risk status using Machine Learning.</p>
            </div>

            <!-- Form Card -->
            <div class="card card-custom p-4">
                <form id="fraudForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Transaction Amount ($)</label>
                            <input type="number" step="any" class="form-control" name="Transaction_Amount" placeholder="e.g. 250.50" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Time Since Last Tx (Min)</label>
                            <input type="number" step="any" class="form-control" name="Time_Since_Last_Tx" placeholder="e.g. 15.2" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Distance From Last Tx (Km)</label>
                            <input type="number" step="any" class="form-control" name="Distance_From_Last_Tx" placeholder="e.g. 10.5" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Distance From Home (Km)</label>
                            <input type="number" step="any" class="form-control" name="Distance_From_Home" placeholder="e.g. 25.0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Daily Limit Used (%)</label>
                            <input type="number" step="any" class="form-control" name="Daily_Limit_Used" placeholder="e.g. 45.5" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Card Age (Days)</label>
                            <input type="number" class="form-control" name="Card_Age_Days" placeholder="e.g. 500" required>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-predict w-100 fs-5" id="submitBtn">
                            <span id="btnText"><i class="fa-solid fa-magnifying-glass me-2"></i>Predict Fraud Status</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                        </button>
                    </div>
                </form>

                <!-- Dynamic Result Display Box -->
                <div id="result-box" class="mt-4 p-3 text-center fs-5 fw-bold"></div>
            </div>

        </div>
    </div>
</div>

<!-- JavaScript for UI/UX Interaction -->
<script>
    document.getElementById('fraudForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Prevents full page reload
        
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const resultBox = document.getElementById('result-box');

        // Show Loading State
        btnText.innerText = "Analyzing Transaction...";
        btnSpinner.style.display = "inline-block";
        submitBtn.disabled = true;
        resultBox.style.display = "none";

        // Collect Form Data
        const formData = new FormData(this);

        try {
            // Send AJAX Request to Flask
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            // Display Result Dynamically
            resultBox.style.display = "block";
            if (data.status === 'success') {
                resultBox.className = "mt-4 p-3 text-center fs-5 fw-bold alert alert-success";
                resultBox.innerHTML = `<i class="fa-solid fa-circle-check me-2"></i>${data.prediction_text}`;
            } else {
                resultBox.className = "mt-4 p-3 text-center fs-5 fw-bold alert alert-danger";
                resultBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation me-2"></i>${data.prediction_text}`;
            }
        } catch (error) {
            resultBox.style.display = "block";
            resultBox.className = "mt-4 p-3 text-center fs-5 fw-bold alert alert-warning";
            resultBox.innerHTML = `<i class="fa-solid fa-circle-xmark me-2"></i>Error processing request. Check Flask backend.`;
        } finally {
            // Reset Button State
            btnText.innerHTML = `<i class="fa-solid fa-magnifying-glass me-2"></i>Predict Fraud Status`;
            btnSpinner.style.display = "none";
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
